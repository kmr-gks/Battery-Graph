name: Release

# v + gradle.properties の appVersionName と同じ名前のタグ（例: v1.1.0）を push したときだけ動く
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that the tag matches appVersionName
        run: |
          VERSION_NAME=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          if [ "v${VERSION_NAME}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match appVersionName ${VERSION_NAME} in gradle.properties"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint and unit tests
        run: ./gradlew lint testDebugUnitTest

      # 署名鍵は、使うステップにだけ渡す
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Google Play には AAB（.aab）をアップロードしてください。
            APK はアップロード鍵で署名されています。Google Play で配信される版とは署名が異なるため、互いに上書き更新できません。

            Upload the AAB (.aab) to Google Play.
            The APK is signed with the upload key, so it cannot update (or be updated by) the version installed from Google Play.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
