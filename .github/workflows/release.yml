name: Release

# 次のどちらかで、main から実行する。バージョンは git から自動で決まり、v + バージョン名のタグと Release を作る
# - gradle.properties の appVersion（バージョンの真ん中の数字）を変えて push したとき（自動）
# - GitHub の Actions 画面の「Run workflow」ボタン（小さな修正版を出すとき）
on:
  push:
    branches: [ "main" ]
    paths: [ "gradle.properties" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # push のときは、appVersion の行が変わったかを確かめる（ほかの設定の変更ではリリースしない）
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether appVersion changed
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # push 前のコミットが分からない場合は、最後のコミットだけを見る
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then BEFORE="HEAD~1"; fi
          if git diff "${BEFORE}" HEAD -- gradle.properties | grep -qE '^[+-]appVersion='; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "appVersion did not change; skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # バージョンをコミット数から求めるため、全履歴を取得する
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          ./gradlew -q :app:printVersion >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Check that the version has not been released
        run: |
          TAG="v${{ steps.version.outputs.versionName }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} is already released. Commit a change first."
            exit 1
          fi

      - name: Lint and unit tests
        run: ./gradlew lint testDebugUnitTest

      # 署名鍵は、使うステップにだけ渡す
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 例: BatteryGraph-v1.1.3-code90.aab
      - name: Rename outputs
        id: files
        run: |
          BASE="BatteryGraph-v${{ steps.version.outputs.versionName }}-code${{ steps.version.outputs.versionCode }}"
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/${BASE}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/${BASE}.apk"
          ls -l dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.versionName }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.versionName }} (versionCode ${{ steps.version.outputs.versionCode }})
          body: |
            Google Play には AAB（.aab）をアップロードしてください。
            APK はアップロード鍵で署名されています。Google Play で配信される版とは署名が異なるため、互いに上書き更新できません。

            Upload the AAB (.aab) to Google Play.
            The APK is signed with the upload key, so it cannot update (or be updated by) the version installed from Google Play.
          files: dist/*
